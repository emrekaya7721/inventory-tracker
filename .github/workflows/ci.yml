name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v3

      - name: Docker Hub'a giriş yap
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Backend image build ve push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/inventory-backend:latest

      - name: Frontend image build ve push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/inventory-frontend:latest

      - name: Worker image build ve push
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/inventory-worker:latest

      - name: File Service image build ve push
        uses: docker/build-push-action@v5
        with:
          context: ./file-service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/inventory-file-service:latest
          - name: Kubernetes'e deploy et
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          kubectl version --client
          kubectl rollout restart deployment/backend
          kubectl rollout restart deployment/frontend
          kubectl rollout restart deployment/worker
          kubectl rollout restart deployment/file-service